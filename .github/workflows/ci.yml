# Intégration continue : VÉRIFIE seulement (tests + build + lint).
# Le déploiement est géré par l'intégration GitHub de Vercel.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verifier:
    name: Tests, build et lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Tests
        run: npx vitest run

      - name: Build
        run: npm run build
        env:
          # Valeurs factices : le build n'appelle jamais Supabase, il lui faut juste des variables présentes
          NEXT_PUBLIC_SUPABASE_URL: https://exemple.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: cle-factice-pour-le-build

      # Non bloquant pour l'instant : le lint n'a pas encore été nettoyé
      - name: Lint
        run: npx eslint .
        continue-on-error: true
